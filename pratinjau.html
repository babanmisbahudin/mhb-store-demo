<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pratinjau PC dan HP – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css">
<style>body{height:100vh;display:flex;flex-direction:column;overflow:hidden}.alat{display:flex;gap:14px;align-items:center;padding:10px 18px;background:#fff;border-bottom:1px solid var(--garis);flex-wrap:wrap}.alat select{width:auto;margin:0;min-height:44px}.alat .pil{margin:0}#p{flex:1;display:flex;gap:22px;justify-content:center;align-items:center;padding:16px;min-height:0;background:#dfe5ea}.bkt{position:relative;background:#fff;overflow:hidden;box-shadow:0 10px 30px #0c182433}.bkt.pc{border-radius:8px}.bkt.hp{border-radius:26px;border:7px solid #0c1824;box-sizing:content-box}iframe{border:0;transform-origin:0 0;display:block}</style></head>
<body><div class="alat"><a href="halaman.html">Semua halaman</a><select id="h" aria-label="Halaman"></select><div class="pil" role="group" aria-label="Mode"><button data-m="dua">PC dan HP</button><button data-m="pc">PC</button><button data-m="hp">HP</button></div></div><div id="p"></div>
<script>const H=[['index','Etalase'],['sepatu','Detail sepatu'],['checkout','Checkout'],['bayar','Pembayaran'],['lacak','Lacak'],['retur','Retur'],['kabari','Kabari saya'],['info','Bantuan'],['admin','Admin: dasbor'],['admin-pesanan','Admin: pesanan'],['admin-kirim','Admin: pengiriman'],['admin-followup','Admin: follow up'],['admin-promo','Admin: promo'],['admin-retur','Admin: retur'],['admin-laporan','Admin: laporan'],['admin-atur','Admin: pengaturan'],['admin-barang','Admin: barang'],['admin-pelanggan','Admin: pelanggan'],['admin-tambah','Admin: tambah sepatu']],h=document.getElementById('h'),p=document.getElementById('p');
h.innerHTML=H.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');let m='dua';const aw=location.hash.slice(1).split('/');if(H.some(x=>x[0]===aw[0]))h.value=aw[0];if(['pc','hp','dua'].includes(aw[1]))m=aw[1];
function gb(){document.querySelectorAll('[data-m]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.m===m));history.replaceState(0,'','#'+h.value+'/'+m);p.innerHTML='';const W=p.clientWidth-60,T=p.clientHeight-46;
const k=(c,w,t,s)=>{p.insertAdjacentHTML('beforeend',`<div class="bkt ${c}" style="width:${w*s}px;height:${t*s}px"><iframe title="${c}" src="${h.value}.html" style="width:${w}px;height:${t}px;transform:scale(${s})"></iframe></div>`)};
const sh=Math.min(T/800,1),hp=390*sh+14;if(m!=='hp'){const sisa=m==='dua'?W-hp-22:W;k('pc',1366,768,Math.min(sisa/1366,T/768,1))}if(m!=='pc')k('hp',390,800,sh);const f=p.querySelector('.hp iframe');if(f)f.onload=()=>{try{const s=f.contentDocument.createElement('style');s.textContent='html{scrollbar-width:none}';f.contentDocument.head.append(s)}catch{}}}
h.onchange=gb;document.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{m=e.dataset.m;gb()});addEventListener('resize',gb);gb()</script></body></html>
