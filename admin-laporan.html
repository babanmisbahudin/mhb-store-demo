<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Laporan – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><div class="jdl"><h1>Laporan</h1><button class="btn garis" id="un">Unduh CSV</button></div><p class="ket">30 hari terakhir. Perkiraan; angka akhir mengikuti laporan Midtrans, Biteship, dan Shopee.</p><div class="kpi" id="kpi"></div>
<div class="dasbor"><section class="kartu"><h2>Uang web</h2><div id="uw"></div></section><section class="kartu"><h2>Metode bayar</h2><div class="gulung"><table><thead><tr><th>Metode</th><th>Pesanan</th><th>Tarif</th></tr></thead><tbody id="mb"></tbody></table></div><p class="ket" style="margin:12px 0 0">Tarif terbit Midtrans di luar PPN.</p></section></div>
<section class="kartu"><h2>Per minggu</h2><div class="gulung"><table class="susun"><thead><tr><th>Minggu</th><th>Pasang</th><th>Web</th><th>Shopee</th></tr></thead><tbody id="mg"></tbody></table></div></section><p role="status" id="m"></p></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-laporan');
const rw=jum(JUAL,x=>x.rw),rs=jum(JUAL,x=>x.rs),pw=jum(JUAL,x=>x.w),ps=jum(JUAL,x=>x.s),ong=pw*16000,pr=jum(PROMO,p=>p.pot),nyata=ong+14000,ptg=Math.round((rw+ong-pr)*.007);
$('#kpi').innerHTML=[['Penjualan web',rp(rw),pw+' pasang'],['Penjualan Shopee',rp(rs),ps+' pasang, di luar potongan Shopee'],['Potongan Midtrans',rp(ptg),'Bila semua lewat QRIS 0,7%'],['Selisih ongkir',rp(nyata-ong),'Ditanggung toko']].map(x=>`<div class="kartu"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');
$('#uw').innerHTML=[['Penjualan sepatu',rw],['Ongkir dibayar pembeli',ong],['Ongkir ke kurir',-nyata],['Potongan kode promo',-pr],['Potongan Midtrans',-ptg]].map(x=>`<div class="jml"><span>${x[0]}</span><span>${x[1]<0?'−'+rp(-x[1]):rp(x[1])}</span></div>`).join('')+`<div class="jml t"><span>Sisa sebelum modal</span><span>${rp(rw+ong-nyata-pr-ptg)}</span></div>`;
const mt={};O.filter(o=>o.s!=='Menunggu').forEach(o=>{const k=o.m.startsWith('VA')?'Virtual account':o.m;mt[k]=(mt[k]||0)+1});$('#mb').innerHTML=Object.entries(mt).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${k}</td><td class="n">${n}</td><td class="n">${{QRIS:'0,7%',GoPay:'2%'}[k]||'Rp4.000'}</td></tr>`).join('');
const W=[];for(let i=JUAL.length;i>0;i-=7)W.push(JUAL.slice(Math.max(0,i-7),i));$('#mg').innerHTML=W.map(a=>`<tr><td data-l="Minggu"><b>${tgl(a[0].d)} sampai ${tgl(a.at(-1).d)}</b></td><td data-l="Pasang" class="n">${jum(a,x=>x.w+x.s)} pasang</td><td data-l="Web" class="n">Web ${rp(jum(a,x=>x.rw))}</td><td data-l="Shopee" class="n">Shopee ${rp(jum(a,x=>x.rs))}</td></tr>`).join('');$('#un').onclick=()=>$('#m').textContent='Contoh: berkas CSV terunduh dan dicatat di jejak audit.';</script></body></html>
