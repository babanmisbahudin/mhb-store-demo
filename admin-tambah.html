<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Tambah sepatu – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main class="sempit"><h1>Tambah sepatu</h1><p class="ket">Dirancang untuk HP. Foto dulu, lalu isi yang wajib.</p><form class="kartu" id="f"><h2>Foto</h2><div class="slotfoto" id="ft" style="margin-bottom:20px"></div><label>Nama<input required></label><div class="dua-kol"><label>Ukuran EU<input required inputmode="decimal"></label><label>Insole (cm)<input required inputmode="decimal"></label><label>Harga web (Rp)<input required inputmode="numeric" id="hw"></label><label>Berat (gram)<input required inputmode="numeric"></label></div><b>Kondisi</b><div class="pil" id="kd" style="margin-top:8px"><button type="button" aria-pressed="false">A</button><button type="button" aria-pressed="true">B</button><button type="button" aria-pressed="false">C</button></div><label>Cacat<small>Satu per baris. Tulis "tidak ada" bila mulus.</small><textarea required rows="2"></textarea></label><label>Kemasan<select><option>Kotak sepatu</option><option>Polymailer</option><option>Kardus kecil</option></select></label><label class="opsi"><span>Bisa dibeli di Shopee juga<small>Di web selalu tayang</small></span><input class="sak" type="checkbox" role="switch" id="jl" checked></label><div id="tl"><label>Harga Shopee (Rp)<small id="sr1">Isi sendiri, boleh berbeda dari web</small><input inputmode="numeric" id="hp2"></label><label>Tautan iklan Shopee<input type="url"></label></div><label>Asal barang<small>Catatan internal, tidak tampil ke pembeli</small><input required></label><button class="btn penuh">Tayangkan</button><button type="button" class="btn garis penuh">Simpan draf</button><p role="status" id="p" style="margin:12px 0 0"></p></form></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-tambah');
$('#ft').innerHTML=['Samping (rak)','Samping dalam','Depan','Belakang','Sol','Label ukuran','Tiap cacat'].map(x=>`<button type="button">${x}</button>`).join('');$$('#ft button').forEach(e=>e.onclick=()=>e.classList.toggle('ada'));
['#kd'].forEach(i=>$$(i+' button').forEach(e=>e.onclick=()=>{$$(i+' button').forEach(q=>q.setAttribute('aria-pressed',q===e));}));const angka=e=>+e.value.replace(/[^0-9]/g,'');function selisih(){const w=angka($('#hw')),p=angka($('#hp2'));$('#sr1').textContent=w&&p?(p===w?'Sama dengan harga web':rp(Math.abs(p-w))+(p>w?' lebih mahal':' lebih murah')+' dari web'):'Isi sendiri, boleh berbeda dari web'}$('#hw').oninput=$('#hp2').oninput=selisih;$('#jl').onchange=e=>$('#tl').hidden=!e.target.checked;$('#f').onsubmit=e=>{e.preventDefault();const n=$$('#ft .ada').length;$('#p').textContent=n<6?'Foto baru '+n+'. Lengkapi minimal 6 sisi sebelum tayang.':'Contoh: sepatu tayang di etalase.'};</script></body></html>
