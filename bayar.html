<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pembayaran – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-kop></header><main class="sempit"><h1 id="j">Selesaikan pembayaran</h1><p class="ket" id="k">Pesanan TK-7K3QX9. Sepatu disimpan untuk Anda selama waktu ini.</p>
<div class="kartu" style="text-align:center"><div class="ket" style="margin:0 auto">Sisa waktu</div><div id="jam" style="font-size:44px;font-weight:800;font-variant-numeric:tabular-nums">60:00</div><div style="font-size:22px;font-weight:700" id="tot"></div></div>
<div class="kartu" id="cara"><h2>Cara bayar</h2><label class="opsi"><input type="radio" name="m" checked><span>QRIS<small>Semua bank dan e-wallet</small></span></label><label class="opsi"><input type="radio" name="m"><span>Virtual account<small>BCA, BRI, BNI, Mandiri, lainnya</small></span></label><label class="opsi"><input type="radio" name="m"><span>E-wallet<small>GoPay, ShopeePay, DANA, OVO</small></span></label><button class="btn penuh" id="b">Bayar sekarang</button><p class="ket" style="margin:12px 0 0">Jendela Midtrans terbuka di sini. Status berubah otomatis, tidak perlu kirim bukti.</p></div>
<div id="aksi"></div><div class="info-demo">Lihat keadaan lain: <span class="pil" style="margin:8px 0 0"><button data-s="tunggu">Menunggu</button><button data-s="cek">Sedang dicek</button><button data-s="lunas">Lunas</button><button data-s="habis">Waktu habis</button></span></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('bayar');
let d=3600;try{$('#tot').textContent=rp(+localStorage.totalMhb||305000)}catch{$('#tot').textContent=rp(305000)}
const S={tunggu:['Selesaikan pembayaran','Pesanan TK-7K3QX9. Sepatu disimpan untuk Anda selama waktu ini.',''],cek:['Pembayaran sedang dicek','Biasanya kurang dari satu menit. Halaman ini berubah sendiri, boleh ditutup.',''],lunas:['Pembayaran diterima','Pesanan TK-7K3QX9 akan dikemas. Resi dikirim ke email dan bisa dilihat di halaman lacak.','<a class="btn penuh" href="lacak.html">Lacak pesanan</a>'+(sudahMasuk()?'':'<a class="btn garis penuh" href="masuk.html">Simpan data saya untuk belanja berikutnya</a>')],habis:['Waktu pembayaran habis','Sepatu dilepas kembali ke etalase. Kalau masih ada, Anda bisa memesan lagi.','<a class="btn penuh" href="index.html">Lihat sepatu</a>']};
function set(s){const x=S[s];$('#j').textContent=x[0];$('#k').textContent=x[1];$('#aksi').innerHTML=x[2];$('#cara').hidden=s!=='tunggu';$('#jam').parentElement.hidden=s==='lunas'||s==='habis';$$('[data-s]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.s===s));if(s==='lunas'){simpanTas([]);kerangka('bayar')}}
$$('[data-s]').forEach(e=>e.onclick=()=>set(e.dataset.s));$('#b').onclick=()=>set('cek');setInterval(()=>{if(d>0)d--;$('#jam').textContent=String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0')},1000);set('tunggu');</script></body></html>
