<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Distributor – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Distributor</h1><p class="ket">Dari mana sepatu dibeli, berapa modalnya, dan mana yang paling menguntungkan.</p><div class="kpi tiga" id="kpi"></div><div class="bagi fu"><div id="l"></div><aside class="kartu" id="d"></aside></div>
<div class="bagi2"><section class="kartu"><h2>Catat pembelian</h2><form id="fb"><label>Distributor<select id="bd"></select></label><div class="dua-kol"><label>Jumlah dibeli (pasang)<input inputmode="numeric" id="bp" required></label><label>Tidak layak jual<input inputmode="numeric" id="bs" value="0"></label><label>Total bayar (Rp)<input inputmode="numeric" id="bt" required></label><label>Ongkir masuk (Rp)<input inputmode="numeric" id="bo" value="0"></label></div><div class="hitung" id="bh" role="status">HPP dihitung dari pasang yang layak jual.</div><button class="btn penuh">Simpan pembelian</button><p class="galat" id="bg" role="alert" hidden></p></form></section>
<section class="kartu"><h2>Tambah distributor</h2><form id="fd"><label>Nama<input id="dn" required maxlength="40"></label><div class="dua-kol"><label>Kota<input id="dk" required maxlength="30"></label><label>Nama kontak<input id="dt" maxlength="30"></label></div><label>Asal barang<select id="da"></select></label><label>Catatan<textarea id="dc" rows="2" maxlength="160"></textarea></label><button class="btn penuh">Tambah</button></form></section></div></main><footer></footer>
<script src="data.js"></script><script src=admin-data.js></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-distributor');

const teks=(t,s)=>{const e=document.createElement(t);e.textContent=s;return e},aman=s=>teks('i',s).innerHTML,angka=e=>+e.value.replace(/[^0-9]/g,'');let p=DIST[0];const bayar=new Set();
const st=d=>{const l=SEMUA().filter(b=>b.d===d.id),k=l.filter(b=>b.laku),r=l.filter(b=>!b.laku);return{l,k,r,m:jum(r,mRak),u:jum(k,b=>uWeb(b)),rt:k.length?Math.round(jum(k,b=>uWeb(b))/k.length):0,ut:d.j==='Titip jual'?k.filter(b=>!bayar.has(b.id)):[]}};
function isi(){const S=DIST.map(st);$('#kpi').innerHTML=[['Distributor aktif',DIST.length,''],['Modal di rak',rp(jum(S,x=>x.m)),jum(S,x=>x.r.length)+' pasang, titipan belum dihitung modal'],['Harus dibayar ke penitip',rp(jum(S,x=>jum(x.ut,b=>b.hpp))),jum(S,x=>x.ut.length)+' pasang titipan sudah laku']].map(x=>`<div class="kartu"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');
$('#l').innerHTML=DIST.map((d,i)=>{const x=S[i],b=x.l[0];return `<button class="kartu fukartu masuk${d===p?' pilih':''}" style="--i:${i}" data-i="${i}"><span class="rakmini">${b?sepatu(b):''}<span class="papan"></span></span><span><b>${aman(d.n)}</b><small>${aman(d.kota)}, ${d.j}</small><small>${x.r.length} di rak, ${x.k.length} laku${x.k.length?', untung '+rp(x.rt)+' per pasang':''}</small></span>${d.j==='Belum jelas'?'<span class="tanda buruk">Asal belum jelas</span>':x.ut.length?'<span class="tanda awas">Ada yang harus dibayar</span>':''}</button>`}).join('');$$('.fukartu').forEach(e=>e.onclick=()=>{p=DIST[e.dataset.i];isi();if(innerWidth<1250)$('#d').scrollIntoView({behavior:diam()?'auto':'smooth'})});det()}
function det(){const x=st(p),bl=BELI.filter(b=>b.d===p.id);$('#d').innerHTML=`<h2>${aman(p.n)}</h2>${p.j==='Belum jelas'?'<p class="catat">Asal barang belum jelas. Pastikan dulu sebelum diiklankan di Shopee, karena barang bekas impor dihapus di sana.</p>':''}<dl><dt>Kota</dt><dd>${aman(p.kota)}</dd><dt>Kontak</dt><dd>${aman(p.kt||'Belum diisi')}</dd><dt>Asal barang</dt><dd>${p.j}</dd><dt>Modal di rak</dt><dd>${rp(x.m)}</dd><dt>Untung dari yang laku</dt><dd>${rp(x.u)}</dd></dl>${p.c?`<p class="ket">${aman(p.c)}</p>`:''}${x.ut.map(b=>`<div class="baris"><span class="mini">${sepatu(b)}</span><div style="flex:1"><b>${b.n}</b><small>Bayar ke penitip ${rp(b.hpp)}</small></div><button class="btn garis kcl" data-y="${b.id}">Sudah dibayar</button></div>`).join('')}<b style="display:block;margin-top:16px">Sepatu di rak</b><div class="kecilan">${x.r.map(b=>`<span title="${b.n}"><span class="mini">${sepatu(b)}</span><small>${rp(modal(b))}</small></span>`).join('')||'<p class="ket">Tidak ada</p>'}</div><b style="display:block;margin-top:16px">Riwayat pembelian</b>${bl.map(b=>`<div class="baris"><div style="flex:1"><b>${b.t}, ${b.p} pasang</b><small>${b.s?b.s+' tidak layak, ':''}total ${rp(b.tot+b.ok)}</small></div><span>${rp(Math.round((b.tot+b.ok)/(b.p-b.s)))} per pasang</span></div>`).join('')||'<p class="ket">Belum ada pembelian tercatat.</p>'}`;$$('[data-y]').forEach(e=>e.onclick=()=>{bayar.add(e.dataset.y);isi()})}
function opsi(){$('#bd').replaceChildren(...DIST.map(d=>Object.assign(teks('option',d.n),{value:d.id})))}$('#da').append(...ASAL.map(a=>teks('option',a)));opsi();
function hb(){const n=angka($('#bp'))-angka($('#bs')),t=angka($('#bt'))+angka($('#bo'));$('#bh').innerHTML=n>0&&t?`<div class="jml"><span>${n} pasang layak</span><b>HPP ${rp(Math.round(t/n))} per pasang</b></div><small>${angka($('#bs'))?'Tanpa yang tidak layak hanya '+rp(Math.round(t/angka($('#bp'))))+', jadi jangan dibagi rata semua.':'Sudah termasuk ongkir masuk'}</small>`:'HPP dihitung dari pasang yang layak jual.'}['#bp','#bs','#bt','#bo'].forEach(i=>$(i).oninput=hb);
$('#fb').onsubmit=e=>{e.preventDefault();const n=angka($('#bp')),s=angka($('#bs')),t=angka($('#bt')),x=!n?'Isi jumlah pasangnya.':s>=n?'Yang tidak layak harus lebih sedikit dari jumlah dibeli.':!t?'Isi total bayarnya.':'';$('#bg').hidden=!x;$('#bg').textContent=x;if(x)return;BELI.unshift({d:$('#bd').value,t:'24 Nov',p:n,s,tot:t,ok:angka($('#bo'))});p=DIST.find(d=>d.id===$('#bd').value);e.target.reset();hb();isi();$('#bh').textContent='Tersimpan. HPP ini terisi otomatis saat menambah sepatu dari pembelian ini.'};
$('#fd').onsubmit=e=>{e.preventDefault();p={id:'d'+(DIST.length+1),n:$('#dn').value.trim(),kota:$('#dk').value.trim(),kt:$('#dt').value.trim(),j:$('#da').value,c:$('#dc').value.trim(),st:1};if(!p.n)return;DIST.push(p);e.target.reset();opsi();isi();$('#l').scrollIntoView({behavior:diam()?'auto':'smooth'})};isi();</script></body></html>
