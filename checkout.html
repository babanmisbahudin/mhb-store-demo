<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Tas dan checkout – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-kop></header><main><div id="isi"></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('checkout');
let kur=0;const kg=t=>Math.max(1,Math.ceil(t.reduce((a,b)=>a+b.g,0)/1000));
const rakHtml=(t,gerak)=>t.map((b,i)=>`<div class="pajang${gerak?' masuk':''}" style="--i:${i}" data-id="${b.id}"><span class="lampu"></span>${sepatu(b)}<span class="papan"></span><div class="cap"><b>${b.n}</b><span>EU ${b.u} · ${rp(b.h)}</span><button type="button" data-h="${b.id}" aria-label="Hapus ${b.n}">Hapus</button></div></div>`).join('');
function kosong(){$('#isi').innerHTML='<h1>Rak Anda masih kosong</h1><p class="ket">Pilih ukuran di etalase, lalu masukkan sepatu yang cocok.</p><div class="rakk"><div class="pajang kosong"><span class="lampu kedip"></span><span class="papan"></span></div></div><p style="text-align:center"><a class="btn" href="index.html">Ke etalase</a></p>';kerangka('checkout')}
if(!ambilTas().length)kosong();
else{$('#isi').innerHTML=`<h1>Tas Anda</h1><p class="ket">Tidak perlu akun.</p><div class="rakk" id="rk"></div><form class="bagi" id="f"><div>
<section class="kartu"><h2>Penerima</h2><label>Nama<input required autocomplete="off" value="Pembeli Contoh"></label><div class="dua-kol"><label>Nomor WhatsApp<input required type="tel" autocomplete="off" value="080000000000"></label><label>Email<input required type="email" autocomplete="off" value="pembeli@contoh.id"></label></div></section>
<section class="kartu"><h2>Alamat</h2><label>Kecamatan<small>Ketik minimal 3 huruf</small><input required list="kec" id="kc" placeholder="Contoh: Coblong"></label><datalist id="kec"><option>Coblong, Kota Bandung, Jawa Barat 40132</option><option>Cigasong, Majalengka, Jawa Barat 45476</option><option>Tebet, Jakarta Selatan, DKI Jakarta 12810</option></datalist><label>Alamat lengkap<textarea required rows="2">Jalan Contoh No. 1</textarea></label></section>
<section class="kartu"><h2>Kurir</h2><div id="kr"><p class="ket" style="margin:0">Isi kecamatan untuk melihat ongkir.</p></div></section></div>
<aside class="kartu"><h2>Ringkasan</h2><div class="jml"><span id="nb"></span><span id="sb"></span></div><div class="jml"><span>Ongkir</span><span id="og"></span></div><div class="jml t"><span>Total</span><span id="tt"></span></div><div class="lekat"><button class="btn penuh" id="buat">Buat pesanan</button></div><p class="ket" style="margin:12px 0 0">Sepatu ditahan 60 menit setelah pesanan dibuat.</p></aside></form>`;
const kurirAda=()=>$('#kc').value.length>2;
function ring(){const t=ambilTas(),s=t.reduce((a,b)=>a+b.h,0),o=kurirAda()?K[kur][2]*kg(t):0;$('#nb').textContent=t.length+' sepatu';hitungKe($('#sb'),s);if(kurirAda())hitungKe($('#og'),o);else{$('#og').textContent='Belum dihitung';$('#og').dataset.n=0}hitungKe($('#tt'),s+o);$('#buat').disabled=!kurirAda()}
function rak(g){$('#rk').innerHTML=rakHtml(ambilTas(),g);$$('[data-h]').forEach(e=>e.onclick=async()=>{const p=e.closest('.pajang');p.classList.add('pergi');await tunda(520);simpanTas(ambilTas().filter(b=>b.id!==e.dataset.h));if(!ambilTas().length)return kosong();rak(false);kr(true);ring();kerangka('checkout')})}
function kr(ulang){if(!kurirAda()){$('#kr').innerHTML='<p class="ket" style="margin:0">Isi kecamatan untuk melihat ongkir.</p>';return}if($('[name=k]')&&!ulang)return;$('#kr').innerHTML=K.map((x,i)=>`<label class="opsi${ulang?'':' masuk'}" style="--i:${i}"><input type="radio" name="k" value="${i}" ${i===kur?'checked':''}><span>${x[0]}<small>${x[1]}${i===0?', termurah':''}</small></span><b>${rp(x[2]*kg(ambilTas()))}</b></label>`).join('');$$('[name=k]').forEach(e=>e.onchange=()=>{kur=+e.value;ring()})}
$('#kc').oninput=()=>{kr();ring()};
$('#f').onsubmit=async e=>{e.preventDefault();const t=ambilTas();try{localStorage.totalMhb=t.reduce((a,b)=>a+b.h,0)+K[kur][2]*kg(t);localStorage.sepatuMhb=t[0].id}catch{}$('#buat').disabled=true;document.body.insertAdjacentHTML('beforeend',`<div class="kemas" role="status"><div class="adegan">${kotak(sepatu(t[0]))}<span class="papan nyala"></span></div><p>Menyimpan sepatu untuk Anda</p></div>`);await tunda(60);$('.kemas').classList.add('tutup');await tunda(2000);location.href='bayar.html'};rak(true);ring()}
addEventListener('pageshow',e=>{if(e.persisted){$('.kemas')?.remove();if($('#buat'))$('#buat').disabled=false}});</script></body></html>
