<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Dasbor – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><div class="jdl"><div><h1>Dasbor</h1><p class="ket" id="sb"></p></div><div class="pil" id="rg" role="group" aria-label="Rentang"><button data-r="7" aria-pressed="false">7 hari</button><button data-r="30" aria-pressed="true">30 hari</button></div></div>
<div class="kpi" id="kpi"></div>
<div class="dasbor"><section class="kartu"><div class="jdl"><h2>Penjualan per hari</h2><button class="btn garis kcl" id="tb" aria-pressed="false">Lihat tabel</button></div><div class="lgd"><span><i style="background:var(--s1)"></i>Web</span><span><i style="background:var(--s2)"></i>Shopee</span></div><div id="gf"></div></section>
<section class="kartu"><h2>Perlu tindakan</h2><div id="pt"></div></section>
<section class="kartu"><div class="jdl"><h2>Pesanan terbaru</h2><a href="admin-pesanan.html">Semua</a></div><div id="ps"></div></section>
<section class="kartu"><h2>Dicari dibanding tersedia</h2><p class="ket" style="margin-bottom:10px">Per ukuran. Petunjuk belanja stok.</p><div class="lgd"><span><i style="background:var(--s1)"></i>Orang menunggu</span><span><i style="background:var(--s2)"></i>Pasang tersedia</span></div><div id="uk"></div></section></div><div class="tip" hidden></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin');

const isiBrs=(b,t,k,a)=>`<div class="baris">${b?`<span class="mini">${sepatu(b)}</span>`:''}<div style="flex:1"><b>${t}</b><small>${k}</small></div>${a}</div>`;
$('#sb').textContent='Sampai '+tgl(JUAL.at(-1).d)+'. Penjualan Shopee dihitung dari barang yang ditandai laku.';
const tip=$('.tip');function tunjuk(e,baris,judul){tip.replaceChildren();const h=document.createElement('b');h.textContent=judul;tip.append(h);baris.forEach(([w,v,n])=>{const r=document.createElement('div'),g=document.createElement('i'),a=document.createElement('strong'),l=document.createElement('span');g.style.background=w;a.textContent=v;l.textContent=n;r.append(g,a,l);tip.append(r)});tip.hidden=false;const k=e.currentTarget.getBoundingClientRect(),x=Math.min(Math.max(8,k.left+k.width/2-tip.offsetWidth/2),innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=Math.max(8,k.top-tip.offsetHeight-8)+'px'}
const tutupTip=()=>tip.hidden=true;addEventListener('scroll',tutupTip,{passive:true});
let r=30,tabel=false;
function isi(){const a=JUAL.slice(-r),rw=jum(a,x=>x.rw),rs=jum(a,x=>x.rs),pw=jum(a,x=>x.w),pp=jum(a,x=>x.s),ty=B.filter(b=>!b.laku);
$('#kpi').innerHTML=[['Penjualan',rp(rw+rs),'Web '+rb(rw)+', Shopee '+rb(rs)],['Pasang terjual',pw+pp,pw+' web, '+pp+' Shopee'],['Rata-rata per pasang',rp(Math.round((rw+rs)/(pw+pp)/1000)*1000),'Di luar ongkir'],['Stok tayang',ty.length+' pasang','Nilai '+rb(jum(ty,b=>b.h))]].map(x=>`<div class="kartu"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');
if(tabel){$('#gf').innerHTML='<div class="gulung tinggi"><table><thead><tr><th>Tanggal</th><th>Web</th><th>Shopee</th></tr></thead><tbody>'+[...a].reverse().map(x=>`<tr><td>${tgl(x.d)}</td><td class="n">${rp(x.rw)}</td><td class="n">${rp(x.rs)}</td></tr>`).join('')+'</tbody></table></div>';return}
const pk=Math.max(...a.map(x=>x.rw+x.rs)),mx=4*[50,100,150,200,250,300,400,500,1000].map(x=>x*1000).find(x=>4*x>=pk),lang=r===7?1:5,sumbu=[4,3,2,1,0].map(i=>mx*i/4);
$('#gf').innerHTML=`<div class="grafik"><div class="sy">${sumbu.map(v=>`<span>${rb(v)}</span>`).join('')}</div><div class="plot">${sumbu.map(()=>'<hr>').join('')}<div class="btgs">${a.map((x,i)=>`<button class="btg" aria-label="${tgl(x.d)}: web ${rp(x.rw)}, Shopee ${rp(x.rs)}"><span class="tmp">${x.rs?`<i class="b2" style="height:${x.rs/mx*100}%"></i>`:''}${x.rw?`<i class="b1${x.rs?'':' ujg'}" style="height:${x.rw/mx*100}%"></i>`:''}</span><small>${(a.length-1-i)%lang===0?tgl(x.d):''}</small></button>`).join('')}</div></div></div>`;
$$('.btg').forEach((e,i)=>{const x=a[i],f=v=>tunjuk(v,[['var(--s1)',rp(x.rw),'Web, '+x.w+' pasang'],['var(--s2)',rp(x.rs),'Shopee, '+x.s+' pasang']],tgl(x.d));e.onpointerenter=e.onfocus=e.onclick=f;e.onpointerleave=e.onblur=tutupTip})}
$$('[data-r]').forEach(e=>e.onclick=()=>{r=+e.dataset.r;$$('[data-r]').forEach(q=>q.setAttribute('aria-pressed',q===e));isi()});$('#tb').onclick=()=>{tabel=!tabel;$('#tb').textContent=tabel?'Lihat grafik':'Lihat tabel';$('#tb').setAttribute('aria-pressed',tabel);tutupTip();isi()};isi();
const A=[...[...B,...ARSIP].filter(b=>b.sp==='matikan').map(b=>[b,'Matikan iklan Shopee: '+b.n,'Sudah laku di web','admin-barang.html']),...O.filter(o=>o.s==='Bermasalah').map(o=>[brg(o.b),'Kembalikan dana '+o.no,o.ms,'admin-pesanan.html#'+o.no]),...O.filter(o=>o.ms&&o.s==='Dikirim').map(o=>[brg(o.b),'Paket tertahan '+o.no,o.k+', '+o.ms.toLowerCase(),'admin-kirim.html']),[null,O.filter(o=>o.s==='Dibayar').length+' pesanan siap dikemas','Sudah lunas','admin-kirim.html'],[null,FU.filter(f=>f.jd===0).length+' orang perlu dihubungi','Follow up hari ini','admin-followup.html'],[null,'Cek pesanan Shopee','Tandai sepatu yang laku di sana','admin-barang.html#aktif'],[null,LEADS.filter(x=>x[6]&&cocok(x).length).length+' permintaan sudah ada sepatunya','Kabari pembelinya','admin-pelanggan.html']];
$('#pt').innerHTML=A.map(x=>isiBrs(x[0],x[1],x[2],`<a class="btn garis kcl" href="${x[3]}">Buka</a>`)).join('');
$('#ps').innerHTML=O.slice(0,5).map(o=>isiBrs(brg(o.b),o.no,brg(o.b).n+', '+rp(tot(o)),`<span class="tanda ${WRN[o.s]||''}">${o.s}</span>`)).join('');
const U=[40,41,42,43,44].map(u=>[u,LEADS.filter(x=>x[4]==='Kabari saya'&&x[1]===u).length,B.filter(b=>b.u===u&&!b.laku&&!(b.tahan>0)).length]),mu=Math.max(...U.flatMap(x=>x.slice(1)));
$('#uk').innerHTML=U.map(x=>`<button class="ub" aria-label="EU ${x[0]}: ${x[1]} menunggu, ${x[2]} tersedia"><b>${x[0]}</b><span><i class="h1" style="width:${x[1]/mu*88}%"></i><em>${x[1]}</em><br><i class="h2" style="width:${x[2]/mu*88}%"></i><em>${x[2]}</em></span></button>`).join('');
$$('.ub').forEach((e,i)=>{const x=U[i];e.onpointerenter=e.onfocus=v=>tunjuk(v,[['var(--s1)',x[1],'orang menunggu'],['var(--s2)',x[2],'pasang tersedia']],'EU '+x[0]);e.onpointerleave=e.onblur=tutupTip});</script></body></html>
