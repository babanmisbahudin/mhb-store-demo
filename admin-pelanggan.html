<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Pelanggan</h1><p class="ket">Leads adalah orang yang tertarik tetapi belum membeli.</p><h2 class="jdl-rak">Permintaan yang sudah ada sepatunya</h2><div class="rakk" id="ck"></div><div class="pil" id="t"></div><div class="pil" id="u" aria-label="Ukuran"></div>

<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-pelanggan');

let s='Leads',u=null,p=P[0];const lead=x=>x[5]!=='Pembeli',cocok=x=>x[4]==='Kabari saya'?B.filter(b=>!b.laku&&!(b.tahan>0)&&b.u===x[1]&&b.t===x[2]&&b.h<=x[3]):[];
const tab=(id,a,f,kini)=>a.forEach(x=>{const e=document.createElement('button');e.textContent=x===null?'Semua ukuran':x;e.setAttribute('aria-pressed',x===kini);e.onclick=()=>{f(x);$$(id+' button').forEach(q=>q.setAttribute('aria-pressed',q===e));isi()};$(id).append(e)});
const C=P.filter(x=>x[6]&&cocok(x).length);$('#ck').innerHTML=C.map((x,i)=>{const b=cocok(x)[0],n=cocok(x).length;return `<div class="pajang masuk tunggu" style="--i:${i}"><span class="lampu"></span>${sepatu(b)}<span class="papan"></span><div class="cap"><b>${b.n}${n>1?' +'+(n-1):''}</b><span>untuk ${x[0]}<br>${M[x[2]]} EU ${x[1]}, sampai ${rp(x[3])}</span><button class="btn garis" data-c="${i}">Kabari</button></div></div>`}).join('');$$('[data-c]').forEach(e=>e.onclick=()=>{C[e.dataset.c][5]='Dihubungi';const g=e.closest('.pajang');g.classList.remove('masuk','tunggu');g.classList.add('dapat');e.outerHTML='<span class="tanda ok" role="status">Terkirim</span>';isi()});

$('#b').innerHTML=l.map(x=>`<tr><td data-l="Nama"><b>${x[0]}</b></td><td data-l="Dicari" style="white-space:nowrap">EU ${x[1]} ${M[x[2]]}</td><td data-l="Asal">${x[4]}</td><td data-l="Status"><span class="tanda ${lead(x)?(x[5]==='Lead baru'?'awas':''):'ok'}">${x[5]}</span></td><td data-l=""><button class="btn garis" style="min-height:44px;padding:8px 12px" data-i="${P.indexOf(x)}">Buka</button></td></tr>`).join('');$('#ks').hidden=l.length>0;$('#b').closest('table').hidden=!l.length;$$('[data-i]').forEach(e=>e.onclick=()=>{p=P[e.dataset.i];det();if(innerWidth<800)$('#d').scrollIntoView()})}
function det(){const c=cocok(p);$('#d').innerHTML=`<h2>${p[0]}</h2><dl><dt>Dicari</dt><dd>EU ${p[1]} ${M[p[2]]}</dd>${p[3]?`<dt>Harga maksimal</dt><dd>${rp(p[3])}</dd>`:''}<dt>Asal</dt><dd>${p[4]}</dd><dt>Terakhir aktif</dt><dd>${p[8]}</dd><dt>Kabar sepatu</dt><dd>${p[6]?'Setuju':'Belum setuju'}</dd><dt>Promo</dt><dd>${p[7]?'Setuju':'Belum setuju'}</dd></dl>${p[4]==='Kabari saya'?`<p class="ket" style="margin:0">${c.length?'Cocok sekarang: '+c.map(b=>b.n).join(', '):'Belum ada yang cocok. Petunjuk untuk belanja stok berikutnya.'}</p>`:p[4]==='Minta lewat Shopee'?'<button class="btn penuh">Balas permintaan</button>':lead(p)?'<p class="ket" style="margin:0">Hanya boleh dihubungi soal barang atau pesanan itu.</p>':'<a class="btn garis penuh" href="admin-pesanan.html">Lihat pesanan</a>'}`}
tab('#t',['Leads','Pembeli','Semua'],x=>s=x,'Leads');tab('#u',[null,40,41,42,43,44],x=>u=x,null);isi();</script></body></html>
