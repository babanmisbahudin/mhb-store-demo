<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pesanan – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Pesanan</h1><div class="pil" id="t"></div><div class="bagi"><div class="kartu gulung"><table class="susun pesan"><thead><tr><th>Nomor</th><th>Sepatu</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="b"></tbody></table><p class="ket" id="ks" style="margin:0" hidden>Belum ada pesanan dengan status ini.</p></div><aside class="kartu" id="d"></aside></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-pesanan');
let s='Semua',p=O.find(o=>o.no===location.hash.slice(1))||O[0];
function isi(){const l=O.filter(o=>s==='Semua'||o.s===s);$('#b').innerHTML=l.map(o=>`<tr class="${o===p?'pilih':''}"><td data-l="Nomor"><b>${o.no}</b><small>${o.t}</small></td><td data-l="Sepatu"><span class="mini">${sepatu(brg(o.b))}</span>${brg(o.b).n}</td><td class="n" data-l="Total">${rp(tot(o))}</td><td data-l="Status"><span class="tanda ${WRN[o.s]||''}">${o.s}</span></td><td data-l=""><button class="btn garis kcl" data-o="${o.no}">Buka</button></td></tr>`).join('');$('#ks').hidden=l.length>0;$('#b').closest('table').hidden=!l.length;$$('[data-o]').forEach(e=>e.onclick=()=>{p=O.find(o=>o.no===e.dataset.o);isi();det();if(innerWidth<1100)$('#d').scrollIntoView({behavior:diam()?'auto':'smooth'})})}
function det(){const b=brg(p.b),L=['Menunggu','Dibayar','Dikemas','Dikirim','Selesai'],n=L.indexOf(p.s),a={Menunggu:'<p class="ket" style="margin:0">Sepatu ditahan 23 menit lagi. Tidak perlu apa-apa.</p>',Dibayar:'<button class="btn penuh" id="k">Buat kiriman</button><button class="btn garis penuh" data-x="Contoh: pesanan dibatalkan dan dana dikembalikan.">Batalkan</button>',Dikemas:'<button class="btn penuh" data-x="Contoh: label terbuka sebagai PDF.">Cetak label</button>',Dikirim:'<a class="btn garis penuh" href="lacak.html">Lihat perjalanan</a>',Selesai:'',Bermasalah:'<button class="btn penuh" data-x="Contoh: pengembalian dicatat. VA lewat transfer ke rekening pembeli.">Kembalikan dana</button>'}[p.s];
$('#d').innerHTML=`<div class="pajang masuk kecilrak" style="--i:0"><span class="lampu"></span>${sepatu(b)}<span class="papan"></span></div><div class="jdl"><h2>${p.no}</h2><span class="tanda ${WRN[p.s]||''}">${p.s}</span></div>${n>=0?`<div class="langkah" aria-hidden="true">${L.map((_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`:''}${p.ms?`<p class="catat">${p.ms}</p>`:''}<dl><dt>Sepatu</dt><dd>${b.n}, EU ${b.u}</dd><dt>Pembeli</dt><dd>${p.p}</dd><dt>Tujuan</dt><dd>${p.ke}</dd><dt>Kurir</dt><dd>${p.k}</dd><dt>Bayar</dt><dd>${p.m}${p.s==='Menunggu'?', belum':''}</dd></dl><div class="jml"><span>Sepatu</span><span>${rp(b.h)}</span></div><div class="jml"><span>Ongkir</span><span>${rp(p.o)}</span></div><div class="jml t"><span>Total</span><span>${rp(tot(p))}</span></div><div style="height:8px"></div>${a}<p role="status" id="m" style="margin:12px 0 0"></p>`;
if($('#k'))$('#k').onclick=async()=>{document.body.insertAdjacentHTML('beforeend',`<div class="kemas" role="status"><div class="adegan">${kotak(sepatu(b))}<span class="papan nyala"></span></div><p>Membuat kiriman</p></div>`);await tunda(60);$('.kemas').classList.add('tutup');await tunda(1900);$('.kemas').remove();p.s='Dikemas';isi();det();$('#m').textContent='Contoh: resi terbit, label siap dicetak.'};$$('[data-x]').forEach(e=>e.onclick=()=>$('#m').textContent=e.dataset.x)}
['Semua','Menunggu','Dibayar','Dikemas','Dikirim','Selesai','Bermasalah'].forEach(x=>{const e=document.createElement('button'),n=O.filter(o=>o.s===x).length;e.textContent=x+(n?' '+n:'');e.setAttribute('aria-pressed',x===s);e.onclick=()=>{s=x;$$('#t button').forEach(q=>q.setAttribute('aria-pressed',q===e));isi()};$('#t').append(e)});isi();det();addEventListener('hashchange',()=>{const o=O.find(x=>x.no===location.hash.slice(1));if(o){p=o;s='Semua';$$('#t button').forEach((z,i)=>z.setAttribute('aria-pressed',i===0));isi();det()}});</script></body></html>
