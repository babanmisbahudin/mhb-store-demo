<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Follow up – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Follow up</h1><p class="ket">Admin membuka WhatsApp dengan pesan yang sudah terisi. Pengingat rutin dikirim otomatis lewat email.</p><div class="kpi tiga" id="kpi"></div><div class="pil" id="t"></div><div class="bagi fu"><div id="l"></div><aside class="kartu" id="d"></aside></div><section class="kartu" style="margin-top:14px"><h2>Email otomatis</h2><div id="em"></div></section></main><footer></footer>
<script src="data.js"></script><script src=admin-data.js></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-followup');

const T={cocok:['Kabar sepatu','Halo {nama}, sepatu yang dicari sudah ada: {sepatu} EU {ukuran}, kondisi {kondisi}, {harga}. Hanya satu pasang. Lihat di sini: {tautan}'],checkout:['Bantu pembayaran','Halo {nama}, pesanan {sepatu} EU {ukuran} belum dibayar dan sudah dilepas. Sepatunya masih ada. Ada kendala saat membayar? Pesan lagi di sini: {tautan}'],sampai:['Tanya kecocokan','Halo {nama}, {sepatu} sudah sampai. Ukurannya pas? Kalau ada yang tidak sesuai deskripsi, kabari kami dalam 7 hari setelah sampai.'],lama:['Sapa pembeli lama','Halo {nama}, ada sepatu EU {ukuran} yang baru tayang: {sepatu}, {harga}. Lihat di sini: {tautan}. Tidak mau dikabari lagi? Balas STOP.'],batal:['Sepatu kembali tayang','Halo {nama}, {sepatu} EU {ukuran} tidak jadi dibayar pembeli sebelumnya dan sekarang tayang lagi: {tautan}']};
let s='Hari ini',p=FU[0];const tbl={'Hari ini':f=>f.jd===0&&!f.h,Terjadwal:f=>f.jd>0&&!f.h,Selesai:f=>f.h},hari=n=>tgl(new Date(2026,10,24+n));
const isiPesan=(f,kp)=>{const b=brg(f.b);let t=T[f.j][1].replace('{nama}',f.n).replace('{sepatu}',b.n).replace('{ukuran}',b.u).replace('{kondisi}',b.k).replace('{harga}',rp(b.h)).replace('{tautan}','mhbstore.contoh/'+b.id);return kp?t+' Pakai kode KABARI15, potongan 15 persen sampai 7 Des.':t};
function kpi(){const n=HASIL.length+FU.filter(f=>f.h).length,m=HASIL.filter(x=>x==='Membeli').length+FU.filter(f=>f.h==='Membeli').length;$('#kpi').innerHTML=[['Perlu dihubungi hari ini',FU.filter(tbl['Hari ini']).length+' orang',FU.filter(tbl.Terjadwal).length+' terjadwal'],['Sudah dihubungi, 30 hari',n+' orang',''],['Jadi membeli',m+' orang',Math.round(m/n*100)+'% dari yang dihubungi']].map(x=>`<div class="kartu"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}
function isi(){kpi();$$('#t button').forEach((e,i)=>{const k=Object.keys(tbl)[i];e.textContent=k+' '+FU.filter(tbl[k]).length;e.setAttribute('aria-pressed',k===s)});const l=FU.filter(tbl[s]).sort((a,b)=>a.jd-b.jd);
$('#l').innerHTML=l.map((f,i)=>`<button class="kartu fukartu masuk${f===p?' pilih':''}" style="--i:${i}" data-i="${FU.indexOf(f)}"><span class="rakmini">${sepatu(brg(f.b))}<span class="papan"></span></span><span><b>${f.n}</b><small>${ALASAN[f.j]}</small><small>${brg(f.b).n}, EU ${brg(f.b).u}</small></span><span class="tanda ${f.h?f.h==='Membeli'?'ok':'':f.jd?'':'awas'}">${f.h||(f.jd?hari(f.jd):'Hari ini')}</span></button>`).join('')||'<p class="catat baik">Tidak ada di daftar ini.</p>';
$$('.fukartu').forEach(e=>e.onclick=()=>{p=FU[e.dataset.i];$$('.fukartu').forEach(q=>q.classList.toggle('pilih',q===e));det();if(innerWidth<1250)$('#d').scrollIntoView({behavior:diam()?'auto':'smooth'})})}
function det(){const tahan=p.j==='batal'&&brg(p.b).tahan>0;$('#d').innerHTML=`<div class="jdl"><h2>${p.n}</h2><span class="tanda">${ALASAN[p.j]}</span></div>${tahan?'<p class="catat">Sepatunya masih sedang dibayar orang lain. Jangan dihubungi dulu.</p>':''}<label style="margin-top:14px">Pesan<small>${T[p.j][0]}, boleh diubah</small><textarea rows="6" id="ps"></textarea></label>${p.pr?'<label class="opsi"><span>Sertakan kode KABARI15<small>Orang ini setuju menerima promo</small></span><input class="sak" type="checkbox" role="switch" id="kp"></label>':'<p class="ket" style="margin:0 0 12px">Tidak menyertakan promo, karena belum ada izinnya.</p>'}<div class="dua-kol"><button class="btn" id="wa" ${tahan||p.h?'disabled':''}>Buka WhatsApp</button><button class="btn garis" id="sl">Salin pesan</button></div><p role="status" id="m" class="ket" style="margin:10px 0 0"></p>
<div id="hs" hidden><b style="display:block;margin-top:14px">Hasilnya</b><div class="pil hsl" style="margin-top:8px">${['Membeli','Tertarik','Tidak lanjut','Jangan hubungi lagi'].map(x=>`<button type="button" data-h="${x}">${x}</button>`).join('')}</div><b>Hubungi lagi</b><div class="pil hsl" style="margin-top:8px">${[[1,'Besok'],[3,'3 hari lagi'],[7,'7 hari lagi']].map(x=>`<button type="button" data-d="${x[0]}">${x[1]}</button>`).join('')}</div></div>
<label>Catatan<textarea rows="2" id="ct"></textarea></label><b>Riwayat</b><ol class="garis-waktu" id="rw" style="margin-top:10px"></ol>`;
$('#ps').value=isiPesan(p);$('#ct').value=p.c;$('#ct').oninput=e=>p.c=e.target.value;const rw=()=>{$('#rw').replaceChildren(...[...p.r].reverse().map((x,i)=>{const l=document.createElement('li'),b=document.createElement('b'),k=document.createElement('small');if(!i)l.className='kini';b.textContent=x[1];k.textContent=x[0];l.append(b,k);return l}))};rw();
if($('#kp'))$('#kp').onchange=e=>$('#ps').value=isiPesan(p,e.target.checked);
$('#sl').onclick=async()=>{try{await navigator.clipboard.writeText($('#ps').value);$('#m').textContent='Pesan disalin.'}catch{$('#ps').select();$('#m').textContent='Pesan dipilih, tekan Ctrl+C.'}};
$('#wa').onclick=()=>{$('#m').textContent='Contoh: WhatsApp terbuka dengan pesan ini. Setelah terkirim, pilih hasilnya.';$('#hs').hidden=false;if(!p.r.some(x=>x[2])){p.r.push(['24 Nov','Dihubungi lewat WhatsApp',1]);rw()}};
$$('[data-h]').forEach(e=>e.onclick=()=>{const v=e.dataset.h;if(v==='Tertarik'){p.jd=1;p.r=p.r.map(x=>x.slice(0,2));p.r.push(['24 Nov','Tertarik, dijadwalkan besok'])}else{p.h=v;p.r.push(['24 Nov',v==='Jangan hubungi lagi'?'Minta tidak dihubungi lagi. Semua kabar dihentikan':'Hasil: '+v])}lanjut(v==='Tertarik'?'Dijadwalkan besok.':'Dicatat: '+v+'.')});$$('[data-d]').forEach(e=>e.onclick=()=>{p.jd=+e.dataset.d;p.r=p.r.map(x=>x.slice(0,2));p.r.push(['24 Nov','Dijadwalkan '+hari(p.jd)]);lanjut('Dijadwalkan '+hari(p.jd)+'.')})}
function lanjut(t){const n=p.n,b=FU.find(f=>tbl[s](f));if(b)p=b;isi();det();$('#m').textContent=n+': '+t}
Object.keys(tbl).forEach(k=>{const e=document.createElement('button');e.onclick=()=>{s=k;const f=FU.find(tbl[k]);if(f){p=f;det()}isi()};$('#t').append(e)});
$('#em').innerHTML=[['Pengingat bayar','20 menit sebelum waktu habis, sekali saja',1,9],['Sepatu yang dicari sudah ada','Hanya yang mengisi Kabari saya, paling banyak sekali sehari',1,14],['Paket diserahkan ke outlet','Berisi nomor resi',1,32],['Tanya kecocokan','3 hari setelah sampai, tidak dikirim bila ada retur',1,21],['Sapa pembeli lama','30 hari setelah membeli, hanya yang setuju promo',0,0]].map(x=>`<label class="opsi"><span>${x[0]}<small>${x[1]}${x[3]?'. Terkirim '+x[3]+' dalam 30 hari':''}</small></span><input class="sak" type="checkbox" role="switch" ${x[2]?'checked':''}></label>`).join('');isi();det();</script></body></html>
