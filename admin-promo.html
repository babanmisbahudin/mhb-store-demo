<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Promo – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Promo</h1><p class="ket">Berlaku di web saja. Promo Shopee diatur di aplikasi Shopee.</p><div class="kpi tiga" id="kpi"></div><h2 class="jdl-rak">Lama di rak</h2><p class="ket" style="margin:0">Lebih dari 30 hari. Harga coret hanya memakai harga yang benar pernah tayang.</p><div class="rakk" id="ck"></div><p role="status" id="m" class="ket"></p>
<div class="bagi"><section><h2>Kode promo</h2><div class="tiketan" id="l"></div></section><aside class="kartu"><h2>Buat kode</h2><form id="f"><label>Kode<small>4 sampai 12 huruf atau angka</small><input id="k" maxlength="12" required autocomplete="off"></label><b>Jenis</b><div class="pil" id="j" style="margin-top:8px"></div><div class="dua-kol"><label><span id="vl">Potongan (%)</span><input id="v" inputmode="numeric" required></label><label id="mx">Maksimal (Rp)<input id="mk" inputmode="numeric"></label></div><div class="dua-kol"><label>Belanja minimal<input id="mn" inputmode="numeric"></label><label>Kuota<input id="q" inputmode="numeric" required value="20"></label></div><label>Berlaku sampai<input id="s" type="date" required value="2026-12-31" min="2026-11-24"></label><label>Untuk<select id="u"><option>Semua pembeli</option><option>Penerima Kabari saya</option><option>Pembeli lama</option></select></label><button class="btn penuh">Buat kode</button><p class="galat" id="g" role="alert" hidden></p></form></aside></div></main><footer></footer>
<script src="data.js"></script><script src=admin-data.js></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-promo');

function kpi(){$('#kpi').innerHTML=[['Kode aktif',PROMO.filter(p=>stP(p)[0]==='Aktif').length+' dari '+PROMO.length,''],['Dipakai',jum(PROMO,p=>p.u)+' kali','Potongan '+rp(jum(PROMO,p=>p.pot))],['Sepatu turun harga',B.filter(b=>b.hc&&!b.laku).length+' pasang','']].map(x=>`<div class="kartu"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}
function rak(g){const l=B.filter(b=>b.hari>30&&!b.laku&&!b.tahan).sort((a,b)=>!!a.hc-!!b.hc||b.hari-a.hari);$('#ck').innerHTML=l.map((b,i)=>`<div class="pajang${g?' masuk':''}${b.hc?'':' tunggu'}" style="--i:${i}"><span class="lampu"></span>${sepatu(b)}<span class="papan"></span>${b.hc?'<span class="label-h">Turun harga</span>':''}<div class="cap"><b>${b.n}</b><span>${b.hari} hari · ${hw(b)}<br>${ung(uWeb(b))}</span>${b.hc?`<button class="btn garis" data-b="${b.id}">Kembalikan</button>`:`<button class="btn garis" data-t="${b.id}">Turunkan 10%</button>`}</div></div>`).join('');
$$('[data-t]').forEach(e=>e.onclick=()=>{const b=brg(e.dataset.t),hb=Math.floor(b.h*.9/1000)*1000;if(uWeb(b,hb)<0&&e.dataset.y!=='1'){e.dataset.y='1';e.textContent='Rugi, tetap?';$('#m').textContent=b.n+' akan rugi '+rp(-uWeb(b,hb))+'. Tekan lagi untuk tetap menurunkan.';return}b.hc=b.h;b.h=Math.floor(b.h*.9/1000)*1000;$('#m').textContent=b.n+' turun dari '+rp(b.hc)+' menjadi '+rp(b.h)+' di web. Harga Shopee tidak berubah.';rak();kpi()});$$('[data-b]').forEach(e=>e.onclick=()=>{const b=brg(e.dataset.b);b.h=b.hc;b.hc=0;$('#m').textContent=b.n+' kembali ke '+rp(b.h)+'.';rak();kpi()})}
const rugiP=p=>p.j==='ongkir'?0:B.filter(b=>!b.laku&&!b.hc&&b.h>=(p.min||0)&&uWeb(b)-(p.j==='persen'?Math.min(Math.floor(b.h*p.v/100),p.maks||1e12):Math.round(p.v/(p.pas||1)))<0).length;function isi(){$('#l').innerHTML=PROMO.map((p,i)=>{const st=stP(p);return `<div class="tiket${st[0]==='Aktif'?'':' mati'}${p.br?' masuk':''}" style="--i:0"><div class="sobek"><strong>${p.k}</strong><span class="tanda ${st[1]}">${st[0]}</span></div><div class="isi-t"><b>${isiP(p)}</b><small>${syP(p)}. ${p.utk}. Sampai ${tglP(p.s)}</small><div class="meter" role="img" aria-label="Dipakai ${p.u} dari ${p.q}"><i style="width:${Math.min(100,p.u/p.q*100)}%"></i></div><small>Dipakai ${p.u} dari ${p.q}${p.pot?', potongan '+rp(p.pot):''}</small>${(n=>n?`<span class="tanda buruk">${n} sepatu bisa rugi</span>`:'')(rugiP(p))}</div><input class="sak" type="checkbox" role="switch" aria-label="Aktifkan ${p.k}" data-i="${i}" ${p.on?'checked':''}></div>`}).join('');$$('#l .sak').forEach(e=>e.onchange=()=>{PROMO[e.dataset.i].on=+e.checked;PROMO.forEach(p=>p.br=0);isi();kpi()})}
let j='persen';const angka=e=>+e.value.replace(/[^0-9]/g,'');[['persen','Persen'],['rupiah','Rupiah'],['ongkir','Ongkir']].forEach(([v,t])=>{const e=document.createElement('button');e.type='button';e.textContent=t;e.setAttribute('aria-pressed',v===j);e.onclick=()=>{j=v;$$('#j button').forEach(q=>q.setAttribute('aria-pressed',q===e));$('#vl').textContent=v==='persen'?'Potongan (%)':'Potongan (Rp)';$('#mx').hidden=v!=='persen'};$('#j').append(e)});
$('#k').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
$('#f').onsubmit=e=>{e.preventDefault();const k=$('#k').value,v=angka($('#v')),mk=angka($('#mk')),q=angka($('#q'));const x=k.length<4?'Kode minimal 4 huruf atau angka.':PROMO.some(p=>p.k===k)?'Kode ini sudah ada.':!v?'Isi besar potongannya.':j==='persen'&&v>50?'Potongan paling besar 50%.':j==='persen'&&!mk?'Isi potongan maksimal supaya tidak merugi.':!q?'Isi kuotanya.':'';$('#g').hidden=!x;$('#g').textContent=x;if(x)return;PROMO.forEach(p=>p.br=0);PROMO.unshift({k,j,v,maks:j==='persen'?mk:0,min:angka($('#mn')),s:$('#s').value,q,u:0,pot:0,utk:$('#u').value,on:1,br:1});isi();kpi();e.target.reset();j='persen';$$('#j button')[0].click()};kpi();rak(true);isi();</script></body></html>
