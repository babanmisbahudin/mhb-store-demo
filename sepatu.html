<body><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-kop></header><main><div id="isi"></div><div id="lain" style="margin-top:40px"></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('sepatu');
function isi(){const b=B.find(x=>x.id===location.hash.slice(1))||B[0],di=ambilTas().some(x=>x.id===b.id);document.title=b.n+' – MHB Store';

<div><h1>${b.n}</h1><div style="font-size:26px;font-weight:700">${rp(b.h)}</div><dl><dt>Ukuran</dt><dd>EU ${b.u}</dd><dt>Panjang insole</dt><dd>${b.in.toLocaleString('id-ID')} cm</dd><dt>Kondisi</dt><dd>${b.k}</dd><dt>Stok</dt><dd>Satu pasang</dd></dl><b>Catatan kondisi</b><ul>${b.cc.map(x=>`<li>${x}</li>`).join('')}</ul><div class="lekat">${a}</div><p role="status" id="p" class="ket" style="margin:12px 0 0"></p><p class="ket" style="margin:12px 0 0">Tidak bisa tukar ukuran. Ukur insole sepatu Anda dulu. <a href="info.html#ukuran">Cara mengukur</a></p></div></div>`;
document.body.classList.add('ada-beli');$$('[data-p]').forEach(e=>e.onclick=()=>$('#p').textContent=e.dataset.p);if($('#tambah'))$('#tambah').onclick=()=>{const t=ambilTas();if(!di)simpanTas([...t,b]);location.href='checkout.html'};
