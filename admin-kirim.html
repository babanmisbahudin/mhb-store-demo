<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pengiriman – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Pengiriman</h1><p class="ket">Paket diantar sendiri ke outlet kurir.</p><div class="kpi" id="kpi"></div><div class="papanan" id="pk"></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-kirim');
const kuota=jum(WEB,x=>x),C=[['Siap dikemas',o=>o.s==='Dibayar','kemas'],['Siap diantar ke outlet',o=>o.s==='Dikemas','antar'],['Di jalan',o=>o.s==='Dikirim'&&!o.ms,'jalan'],['Bermasalah',o=>o.s==='Dikirim'&&o.ms,'masalah']],kur=o=>o.k.split(' ')[0];
const aksi={kemas:o=>`<button class="btn garis kcl" data-a="kemas" data-o="${o.no}">Kemas</button>`,antar:o=>`<label class="rs">Nomor resi<small>Dari label atau struk outlet</small><input data-r="${o.no}" autocomplete="off" value="${o.resi||''}" placeholder="Isi nomor resi"></label><button class="btn kcl" data-a="antar" data-o="${o.no}">Sudah diserahkan</button><button class="btn garis kcl" data-a="label" data-o="${o.no}">Cetak label</button><p class="galat" role="alert" hidden></p>`,jalan:()=>'<a class="btn garis kcl" href="lacak.html">Lacak</a>',masalah:o=>`<p class="ket" style="margin:0 0 10px">Tanyakan ke outlet ${kur(o)} dengan membawa resi.</p><button class="btn garis kcl" data-a="kabari" data-o="${o.no}">Kabari pembeli</button>`};
function isi(){const an=O.filter(C[1][1]),per={};an.forEach(o=>per[kur(o)]=(per[kur(o)]||0)+1);
$('#kpi').innerHTML=`<div class="kartu"><span>Antar ke outlet</span><strong>${an.length} paket</strong><small>${Object.entries(per).map(([k,n])=>k+' '+n).join(', ')||'Tidak ada'}</small></div><div class="kartu"><span>Kiriman 30 hari terakhir</span><strong>${kuota} dari 100</strong><div class="meter" role="img" aria-label="${kuota} dari 100 kiriman"><i style="width:${kuota}%"></i></div><small>Kuota 100 per bulan</small></div><div class="kartu"><span>Saldo Biteship</span><strong>Rp412.000</strong><small>Isi ulang di dasbor Biteship</small></div><div class="kartu"><span>Selisih ongkir</span><strong>${rp(jum(O,o=>Math.max(0,o.n-o.o)))}</strong><small>Berat nyata melebihi data</small></div>`;
$('#pk').innerHTML=C.map(([t,f,a])=>{const l=O.filter(f).sort((x,y)=>kur(x).localeCompare(kur(y)));return `<section class="kol"><h2>${t} <em>${l.length}</em></h2>${l.map(o=>`<div class="kartu tk" data-k="${o.no}"><span class="rakmini">${a==='antar'?kotak(sepatu(brg(o.b))):sepatu(brg(o.b))}<span class="papan"></span></span><b>${o.no}</b><small>${brg(o.b).n}, ${o.k}<br>${o.ke}</small>${o.ms?`<p class="catat">${o.ms}</p>`:''}${aksi[a](o)}</div>`).join('')||'<p class="ket">Kosong</p>'}</section>`}).join('');
$$('[data-a]').forEach(e=>e.onclick=async()=>{const o=O.find(x=>x.no===e.dataset.o),k=e.closest('.tk');if(e.dataset.a==='label'){e.textContent='Label siap (contoh)';return}if(e.dataset.a==='kabari'){e.outerHTML='<span class="tanda ok" role="status">Pembeli dikabari</span>';return}
if(e.dataset.a==='antar'){const v=k.querySelector('input').value.trim();if(v.length<8){const g=k.querySelector('.galat');g.hidden=false;g.textContent='Isi nomor resi lebih dulu, minimal 8 huruf atau angka.';k.querySelector('input').focus();return}o.resi=v;o.s='Dikirim'}else o.s='Dikemas';
k.classList.add('pindah');await tunda(450);isi();const b=$(`[data-k="${o.no}"]`);b?.classList.add('baru')})}isi();</script></body></html>
