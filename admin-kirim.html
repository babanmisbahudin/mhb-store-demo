<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pengiriman – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Pengiriman</h1><div class="kpi tiga" id="kpi"></div><div class="papanan" id="pk"></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-kirim');
const kuota=jum(WEB,x=>x),C=[['Siap dikemas',o=>o.s==='Dibayar','Buat kiriman'],['Menunggu dijemput',o=>o.s==='Dikemas','Cetak label'],['Di jalan',o=>o.s==='Dikirim'&&!o.ms,''],['Bermasalah',o=>o.s==='Dikirim'&&o.ms,'Hubungi kurir']];
$('#kpi').innerHTML=`<div class="kartu"><span>Kiriman 30 hari terakhir</span><strong>${kuota} dari 100</strong><div class="meter" role="img" aria-label="${kuota} dari 100 kiriman"><i style="width:${kuota}%"></i></div><small>Kuota 100 per bulan, peringatan di kiriman ke-80</small></div><div class="kartu"><span>Saldo Biteship</span><strong>Rp412.000</strong><small>Isi ulang di dasbor Biteship</small></div><div class="kartu"><span>Selisih ongkir</span><strong>${rp(jum(O,o=>Math.max(0,o.n-o.o)))}</strong><small>Berat nyata melebihi data</small></div>`;
function isi(){$('#pk').innerHTML=C.map(([t,f,a])=>{const l=O.filter(f);return `<section class="kol"><h2>${t} <em>${l.length}</em></h2>${l.map(o=>`<div class="kartu tk"><span class="rakmini">${sepatu(brg(o.b))}<span class="papan"></span></span><b>${o.no}</b><small>${brg(o.b).n}, ${o.k}<br>${o.ke}</small>${o.ms?`<p class="catat">${o.ms}</p>`:''}${a?`<button class="btn garis kcl" data-o="${o.no}">${a}</button>`:'<a class="btn garis kcl" href="lacak.html">Lacak</a>'}</div>`).join('')||'<p class="ket">Kosong</p>'}</section>`}).join('');$$('[data-o]').forEach(e=>e.onclick=()=>{const o=O.find(x=>x.no===e.dataset.o);if(o.s==='Dibayar'){o.s='Dikemas';isi();const k=$(`[data-o="${o.no}"]`)?.closest('.tk');k?.classList.add('baru')}else{e.outerHTML='<span class="tanda ok" role="status">'+(o.ms?'Dihubungi':'Label siap')+'</span>'}})}isi();</script></body></html>
