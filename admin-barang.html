<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Barang – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><div class="dua" style="align-items:center;margin-bottom:18px"><h1>Barang</h1><a class="btn" href="admin-tambah.html">Tambah sepatu</a></div><div class="kartu gulung"><table class="susun"><thead><tr><th>Sepatu</th><th>Ukuran</th><th>Kondisi</th><th>Harga</th><th>Status</th><th>Jalur</th></tr></thead><tbody id="b"></tbody></table><p role="status" id="p" class="ket" style="margin:14px 0 0"></p></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-barang');
$('#b').innerHTML=B.map((b,i)=>`<tr><td data-l="Sepatu"><b>${b.n}</b></td><td data-l="Ukuran">${b.u}</td><td data-l="Kondisi">${b.k}</td><td class="n" data-l="Harga">${rp(b.h)}</td><td data-l="Status"><span class="tanda ${b.laku?'ok':b.tahan?'awas':''}">${b.laku?'Terjual':b.tahan?'Ditahan':'Tayang'}</span></td><td data-l="Jalur"><select data-i="${i}" aria-label="Jalur ${b.n}" style="margin:0;min-width:118px;width:auto" ${b.laku||b.tahan?'disabled':''}><option ${b.j==='web'?'selected':''}>Web</option><option ${b.j==='shopee'?'selected':''}>Shopee</option></select></td></tr>`).join('');$$('select').forEach(e=>e.onchange=()=>$('#p').textContent=e.value==='Web'?'Pastikan iklan '+B[e.dataset.i].n+' di Shopee sudah nonaktif sebelum dipindah ke web.':B[e.dataset.i].n+' pindah ke Shopee. Tempel tautan iklannya.');</script></body></html>
