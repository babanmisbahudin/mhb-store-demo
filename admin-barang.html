<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Barang – MHB Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><link rel="stylesheet" href="gaya.css"></head>
<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Barang</h1><p class="ket">Setiap sepatu bisa dibeli di web atau Shopee, dengan harga masing-masing. Yang laku di satu tempat harus ditutup di tempat lain.</p><div id="ks"></div><div class="pil" id="t"></div><div class="kartu gulung"><table class="susun brg"><thead><tr><th>Sepatu</th><th>Ukuran</th><th>Kondisi</th><th>Harga web</th><th>Web</th><th>Shopee</th></tr></thead><tbody id="b"></tbody></table><p role="status" id="p" class="ket" style="margin:14px 0 0"></p></div></main><footer></footer>
<script src="data.js"></script><script>const $$=s=>[...document.querySelectorAll(s)];kerangka('admin-barang');
const SM=()=>[...B,...ARSIP],F={Semua:b=>true,Tayang:b=>!b.laku&&!b.tahan,'Di Shopee':b=>b.sp==='aktif'&&!b.laku,'Hanya web':b=>b.sp==='belum',Ditahan:b=>b.tahan>0,Terjual:b=>b.laku},SP={aktif:['Aktif','ok'],siaga:['Bersiap dimatikan','awas'],matikan:['Harus dimatikan','buruk'],nonaktif:['Nonaktif',''],belum:['Belum diiklankan','']};const hs=decodeURIComponent(location.hash.slice(1)).toLowerCase();let s=hs==='aktif'?'Di Shopee':'Semua',q=hs&&hs!=='aktif'?hs:'';
function atas(){const l=SM().filter(b=>b.sp==='matikan'||b.sp==='siaga').sort((a,b)=>(a.sp==='siaga')-(b.sp==='siaga'));$('#ks').innerHTML=l.length?`<h2 class="jdl-rak">Tutup di Shopee</h2><div class="rakk" id="ck">${l.map((b,i)=>`<div class="pajang masuk ${b.sp}" style="--i:${i}"><span class="lampu"></span>${sepatu(b)}<span class="papan"></span><div class="cap"><b>${b.n}</b><span>${b.sp==='siaga'?'Sedang dibayar di web':'Laku di web, iklan masih hidup'}</span>${b.sp==='matikan'?`<button class="btn garis" data-m="${b.id}">Sudah dimatikan</button>`:''}</div></div>`).join('')}</div>`:'<p class="catat baik">Tidak ada iklan Shopee yang perlu ditutup.</p>';
$$('[data-m]').forEach(e=>e.onclick=async()=>{const b=brg(e.dataset.m);e.closest('.pajang').classList.add('pergi');await tunda(500);b.sp='nonaktif';atas();isi();$('#p').textContent=b.n+' sudah ditutup di Shopee.'})}
function isi(){const l=SM().filter(b=>F[s](b)&&b.n.toLowerCase().includes(q));$('#b').innerHTML=l.map(b=>`<tr class="${b.laku?'sdh':''}"><td data-l="Sepatu"><span class="mini">${sepatu(b)}</span><b>${b.n}</b></td><td data-l="Ukuran">${b.u}</td><td data-l="Kondisi">${b.k}</td><td class="n" data-l="Harga">${rp(b.h)}<small>${b.hs?'Shopee '+rp(b.hs):'Tanpa harga Shopee'}</small></td><td data-l="Web"><span class="tanda ${b.laku?'':b.tahan?'awas':'ok'}">${b.laku?'Terjual':b.tahan?'Ditahan':'Tayang'}</span></td><td data-l="Shopee"><span class="tanda ${SP[b.sp][1]}">${SP[b.sp][0]}</span>${b.sp==='aktif'&&!b.laku?` <button class="btn garis kcl" data-l="${b.id}">Laku di Shopee</button>`:''}</td></tr>`).join('');$('#p').textContent=q?'Hasil cari: '+q+', '+l.length+' sepatu':l.length+' sepatu';
$$('#t button').forEach((e,i)=>{const k=Object.keys(F)[i];e.textContent=k+' '+SM().filter(F[k]).length;e.setAttribute('aria-pressed',k===s)});
$$('button[data-l]').forEach(e=>e.onclick=()=>{const b=brg(e.dataset.l);if(e.dataset.y!=='1'){e.dataset.y='1';e.textContent='Yakin? Tekan lagi';return}b.laku=1;b.sp='nonaktif';isi();$('#p').textContent=b.n+' ditandai laku di Shopee dan langsung ditutup di web.'})}
addEventListener('hashchange',()=>{q=decodeURIComponent(location.hash.slice(1)).toLowerCase();s='Semua';isi()});Object.keys(F).forEach(x=>{const e=document.createElement('button');e.onclick=()=>{s=x;q='';isi()};$('#t').append(e)});atas();isi();</script></body></html>
