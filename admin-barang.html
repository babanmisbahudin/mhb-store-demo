<body class="gelap adm"><p class="pita">Contoh rancangan. Tidak ada transaksi, jangan isi data asli.</p><header data-admin></header><main><h1>Barang</h1><div class="pil" id="t"></div><div class="kartu gulung"><table class="susun brg"><thead><tr><th>Sepatu</th><th>Ukuran</th><th>Kondisi</th><th>Harga</th><th>Status</th><th>Jalur</th></tr></thead><tbody id="b"></tbody></table><p role="status" id="p" class="ket" style="margin:14px 0 0"></p></div></main><footer></footer>

function isi(){const l=[...B,...ARSIP].filter(b=>F[s](b)&&b.n.toLowerCase().includes(q));$('#b').innerHTML=l.map(b=>`<tr class="${b.laku?'sdh':''}"><td data-l="Sepatu"><span class="mini">${sepatu(b)}</span><b>${b.n}</b></td><td data-l="Ukuran">${b.u}</td><td data-l="Kondisi">${b.k}</td><td class="n" data-l="Harga">${rp(b.h)}</td><td data-l="Status"><span class="tanda ${b.laku?'ok':b.tahan?'awas':''}">${b.laku?'Terjual':b.tahan?'Ditahan':'Tayang'}</span></td><td data-l="Jalur"><select data-i="${b.id}" aria-label="Jalur ${b.n}" style="margin:0;min-width:118px;width:auto" ${b.laku||b.tahan?'disabled':''}><option ${b.j==='web'?'selected':''}>Web</option><option ${b.j==='shopee'?'selected':''}>Shopee</option>${b.j==='shopee'?'<option>Laku di Shopee</option>':''}</select></td></tr>`).join('');$('#p').textContent=q?'Hasil cari: '+q+', '+l.length+' sepatu':l.length+' sepatu';$$('select[data-i]').forEach(e=>e.onchange=()=>{const b=brg(e.dataset.i);if(e.value==='Laku di Shopee'){b.laku=1;isi();$('#p').textContent=b.n+' ditandai laku di Shopee.';return}$('#p').textContent=e.value==='Web'?'Pastikan iklan '+b.n+' di Shopee sudah nonaktif sebelum dipindah ke web.':b.n+' pindah ke Shopee. Tempel tautan iklannya.'})}
addEventListener('hashchange',()=>{q=decodeURIComponent(location.hash.slice(1)).toLowerCase();s='Semua';$$('#t button').forEach((z,i)=>z.setAttribute('aria-pressed',i===0));isi()});Object.keys(F).forEach(x=>{const e=document.createElement('button');e.textContent=x+' '+[...B,...ARSIP].filter(F[x]).length;e.setAttribute('aria-pressed',x===s);e.onclick=()=>{s=x;q='';$$('#t button').forEach(z=>z.setAttribute('aria-pressed',z===e));isi()};$('#t').append(e)});isi();</script></body></html>
